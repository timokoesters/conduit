[processes.cargo-fmt]
command = ["cargo", "fmt", "--check", "--", "--color=always"]
ready-when = "exited"

[processes.cargo-doc]
command = [
  "cargo",
  "doc",
  "--workspace",
  "--no-deps",
  "--document-private-items",
  "--color",
  "always",
]
environment.RUSTDOCFLAGS = "-D warnings"
ready-when = "exited"

[processes.cargo-clippy]
command = [
  "cargo",
  "clippy",
  "--workspace",
  "--all-targets",
  "--color=always",
  "--",
  "-D",
  "warnings",
]
ready-when = "exited"

[processes.taplo-fmt]
command = ["taplo", "fmt", "--check", "--colors", "always"]
ready-when = "exited"

[processes.lychee]
command = ["lychee", "--offline", "docs"]
ready-when = "exited"

[processes.typos]
command = ["typos"]
ready-when = "exited"

[processes.cargo]
command = [
  "cargo",
  "test",
  "--workspace",
  "--all-targets",
  "--color=always",
  "--",
  "--color=always",
]
ready-when = "exited"
